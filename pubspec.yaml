name: kalsada
description: "Kalsada — AI-assisted group travel planner."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  mobx: ^2.4.0
  flutter_mobx: ^2.2.1
  get_it: ^9.2.1
  freezed_annotation: ^3.1.0
  intl: ^0.20.0
  supabase_flutter: ^2.9.0
  flutter_map: ^8.2.0
  latlong2: ^0.9.1
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  genui: ^0.10.1
  meta: ^1.16.0
  a2ui_core: ^0.1.0
  json_schema_builder: ^0.1.3
  cached_network_image: ^3.4.1
  flutter_map_cache: ^1.5.2
  dio_cache_interceptor: ^3.5.1
  dio_cache_interceptor_hive_store: ^4.0.0
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.1
  drift: ^2.34.2
